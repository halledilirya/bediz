[workspace]
members = ["crates/core", "crates/platform", "app/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/halledilirya/bediz"
publish = false

[workspace.dependencies]
bediz-core = { path = "crates/core" }
bediz-platform = { path = "crates/platform" }
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = true
strip = true

[profile.quick]
inherits = "release"
codegen-units = 16
debug-assertions = true
incremental = true
lto = false
overflow-checks = true
