<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bediz</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="settings" hidden>
      <nav class="rail">
        <input
          type="search"
          id="search"
          class="search"
          autocomplete="off"
          spellcheck="false"
        />
        <button
          type="button"
          data-section="general"
          data-l10n-id="settings-section-general"
        ></button>
        <button
          type="button"
          data-section="shortcuts"
          data-l10n-id="settings-section-shortcuts"
        ></button>
        <button
          type="button"
          data-section="selecting"
          data-l10n-id="settings-section-selecting"
        ></button>
        <button
          type="button"
          data-section="saving"
          data-l10n-id="settings-section-saving"
        ></button>
        <button
          type="button"
          data-section="memory"
          data-l10n-id="settings-section-memory"
        ></button>
        <button
          type="button"
          data-section="updates"
          data-l10n-id="settings-section-updates"
        ></button>
        <button
          type="button"
          data-section="about"
          data-l10n-id="settings-section-about"
        ></button>
      </nav>
      <form class="pane" id="pane">
        <section class="group" id="general">
          <h2 data-l10n-id="settings-section-general"></h2>
          <div class="card">
            <div class="row" data-search="settings-start-with-windows">
              <div class="row-text">
                <label
                  for="start-with-windows"
                  data-l10n-id="settings-start-with-windows"
                ></label>
                <p data-l10n-id="settings-start-with-windows-detail"></p>
              </div>
              <span class="switch">
                <input
                  type="checkbox"
                  role="switch"
                  id="start-with-windows"
                  name="startWithWindows"
                />
                <span class="switch-text" aria-hidden="true">
                  <span class="on" data-l10n-id="settings-on"></span>
                  <span class="off" data-l10n-id="settings-off"></span>
                </span>
              </span>
              <p class="row-error" id="start-error" role="alert" hidden></p>
            </div>
            <div class="row note warn" id="start-off-note" role="status" hidden>
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path
                  d="M8 1.5l7 12.5H1z"
                  fill="none"
                  stroke="currentColor"
                  stroke-linejoin="round"
                />
                <path
                  d="M8 6v4M8 11.8v.4"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                />
              </svg>
              <p data-l10n-id="settings-start-turned-off"></p>
            </div>
            <div class="row" data-search="settings-language">
              <div class="row-text">
                <label for="language" data-l10n-id="settings-language"></label>
                <p data-l10n-id="settings-language-detail"></p>
              </div>
              <span class="select">
                <select id="language" name="language">
                  <option
                    value=""
                    data-l10n-id="settings-language-system"
                  ></option>
                </select>
              </span>
            </div>
            <div class="row" data-search="settings-theme">
              <div class="row-text">
                <span id="theme-label" data-l10n-id="settings-theme"></span>
                <p data-l10n-id="settings-theme-detail"></p>
              </div>
              <div
                class="segmented"
                role="radiogroup"
                aria-labelledby="theme-label"
              >
                <input
                  type="radio"
                  name="theme"
                  id="theme-system"
                  value="system"
                />
                <label
                  for="theme-system"
                  data-l10n-id="settings-theme-system"
                ></label>
                <input
                  type="radio"
                  name="theme"
                  id="theme-light"
                  value="light"
                />
                <label
                  for="theme-light"
                  data-l10n-id="settings-theme-light"
                ></label>
                <input type="radio" name="theme" id="theme-dark" value="dark" />
                <label
                  for="theme-dark"
                  data-l10n-id="settings-theme-dark"
                ></label>
              </div>
            </div>
            <div class="row" data-search="settings-accent">
              <div class="row-text">
                <span id="accent-label" data-l10n-id="settings-accent"></span>
                <p data-l10n-id="settings-accent-detail"></p>
              </div>
              <div
                class="swatches"
                role="radiogroup"
                aria-labelledby="accent-label"
              >
                <input
                  type="radio"
                  name="accent"
                  id="accent-blue"
                  value="blue"
                />
                <label for="accent-blue" data-accent="blue">
                  <span data-l10n-id="settings-accent-blue"></span>
                </label>
                <input
                  type="radio"
                  name="accent"
                  id="accent-teal"
                  value="teal"
                />
                <label for="accent-teal" data-accent="teal">
                  <span data-l10n-id="settings-accent-teal"></span>
                </label>
                <input
                  type="radio"
                  name="accent"
                  id="accent-purple"
                  value="purple"
                />
                <label for="accent-purple" data-accent="purple">
                  <span data-l10n-id="settings-accent-purple"></span>
                </label>
                <input
                  type="radio"
                  name="accent"
                  id="accent-pink"
                  value="pink"
                />
                <label for="accent-pink" data-accent="pink">
                  <span data-l10n-id="settings-accent-pink"></span>
                </label>
              </div>
            </div>
          </div>
        </section>
        <section class="group" id="shortcuts">
          <h2 data-l10n-id="settings-section-shortcuts"></h2>
          <div class="card">
            <div class="row status" id="hotkey-status" hidden>
              <div class="row-text">
                <span class="chip" id="hotkey-chip"></span>
                <p id="hotkey-detail"></p>
              </div>
              <button
                type="button"
                class="button primary"
                id="take-print-screen"
                data-l10n-id="settings-hotkey-take"
                hidden
              ></button>
              <button
                type="button"
                class="button"
                id="retry-hotkey"
                data-l10n-id="settings-hotkey-retry"
                hidden
              ></button>
            </div>
            <div class="row" data-search="settings-hotkey-region">
              <div class="row-text">
                <span data-l10n-id="settings-hotkey-region"></span>
                <p data-l10n-id="settings-hotkey-region-detail"></p>
              </div>
              <div class="hotkey">
                <span class="keys" id="hotkey-keys" aria-live="polite"></span>
                <button
                  type="button"
                  class="button"
                  id="record-hotkey"
                  data-l10n-id="settings-hotkey-change"
                ></button>
              </div>
              <input type="hidden" name="hotkey" />
              <p class="row-error" id="hotkey-error" role="alert" hidden></p>
            </div>
            <div class="row" data-search="settings-ask-about-hotkey">
              <div class="row-text">
                <label
                  for="ask-about-hotkey"
                  data-l10n-id="settings-ask-about-hotkey"
                ></label>
                <p data-l10n-id="settings-ask-about-hotkey-detail"></p>
              </div>
              <span class="switch">
                <input
                  type="checkbox"
                  role="switch"
                  id="ask-about-hotkey"
                  name="askAboutHotkey"
                />
                <span class="switch-text" aria-hidden="true">
                  <span class="on" data-l10n-id="settings-on"></span>
                  <span class="off" data-l10n-id="settings-off"></span>
                </span>
              </span>
            </div>
            <div class="row status" id="gif-hotkey-status" hidden>
              <div class="row-text">
                <span class="chip" id="gif-hotkey-chip"></span>
                <p id="gif-hotkey-detail"></p>
              </div>
              <button
                type="button"
                class="button primary"
                id="gif-take-print-screen"
                data-l10n-id="settings-hotkey-take"
                hidden
              ></button>
              <button
                type="button"
                class="button"
                id="gif-retry-hotkey"
                data-l10n-id="settings-hotkey-retry"
                hidden
              ></button>
            </div>
            <div class="row" data-search="settings-hotkey-gif">
              <div class="row-text">
                <span data-l10n-id="settings-hotkey-gif"></span>
                <p data-l10n-id="settings-hotkey-gif-detail"></p>
              </div>
              <div class="hotkey">
                <span
                  class="keys"
                  id="gif-hotkey-keys"
                  aria-live="polite"
                ></span>
                <button
                  type="button"
                  class="button"
                  id="record-gif-hotkey"
                  data-l10n-id="settings-hotkey-change"
                ></button>
                <button
                  type="button"
                  class="button"
                  id="remove-gif-hotkey"
                  data-l10n-id="settings-hotkey-remove"
                  hidden
                ></button>
              </div>
              <input type="hidden" name="gifHotkey" />
              <p
                class="row-error"
                id="gif-hotkey-error"
                role="alert"
                hidden
              ></p>
            </div>
            <div class="row note info">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" />
                <path
                  d="M8 7v4.5M8 4.5v.5"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                />
              </svg>
              <p data-l10n-id="settings-elevated-note"></p>
            </div>
          </div>
        </section>
        <section class="group" id="selecting">
          <h2 data-l10n-id="settings-section-selecting"></h2>
          <div class="card">
            <div class="row" data-search="settings-detect-windows">
              <div class="row-text">
                <label
                  for="detect-windows"
                  data-l10n-id="settings-detect-windows"
                ></label>
                <p data-l10n-id="settings-detect-windows-detail"></p>
              </div>
              <span class="switch">
                <input
                  type="checkbox"
                  role="switch"
                  id="detect-windows"
                  name="detectWindows"
                />
                <span class="switch-text" aria-hidden="true">
                  <span class="on" data-l10n-id="settings-on"></span>
                  <span class="off" data-l10n-id="settings-off"></span>
                </span>
              </span>
            </div>
            <div class="row" data-search="settings-success-labels">
              <div class="row-text">
                <label
                  for="success-labels"
                  data-l10n-id="settings-success-labels"
                ></label>
                <p data-l10n-id="settings-success-labels-detail"></p>
              </div>
              <span class="switch">
                <input
                  type="checkbox"
                  role="switch"
                  id="success-labels"
                  name="successLabels"
                />
                <span class="switch-text" aria-hidden="true">
                  <span class="on" data-l10n-id="settings-on"></span>
                  <span class="off" data-l10n-id="settings-off"></span>
                </span>
              </span>
            </div>
            <div class="row" data-search="settings-enter">
              <div class="row-text">
                <label for="enter" data-l10n-id="settings-enter"></label>
                <p data-l10n-id="settings-enter-detail"></p>
              </div>
              <span class="select">
                <select id="enter" name="enter">
                  <option
                    value="copyAndSave"
                    data-l10n-id="settings-enter-copy-and-save"
                  ></option>
                  <option
                    value="copy"
                    data-l10n-id="settings-enter-copy"
                  ></option>
                  <option
                    value="save"
                    data-l10n-id="settings-enter-save"
                  ></option>
                </select>
              </span>
            </div>
          </div>
        </section>
        <section class="group" id="saving">
          <h2 data-l10n-id="settings-section-saving"></h2>
          <div class="card">
            <div class="row" data-search="settings-folder">
              <div class="row-text">
                <span data-l10n-id="settings-folder"></span>
                <p class="path"><span dir="ltr" id="folder-path"></span></p>
              </div>
              <div class="actions">
                <button
                  type="button"
                  class="button"
                  id="open-folder"
                  data-l10n-id="settings-folder-open"
                ></button>
                <button
                  type="button"
                  class="button"
                  id="change-folder"
                  data-l10n-id="settings-folder-change"
                ></button>
                <button
                  type="button"
                  class="button"
                  id="reset-folder"
                  data-l10n-id="settings-folder-reset"
                  hidden
                ></button>
              </div>
              <input type="hidden" name="saveFolder" />
              <p class="row-error" id="folder-error" role="alert" hidden></p>
            </div>
            <div class="row note warn" id="onedrive-note" hidden>
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path
                  d="M8 1.5l7 12.5H1z"
                  fill="none"
                  stroke="currentColor"
                  stroke-linejoin="round"
                />
                <path
                  d="M8 6v4M8 11.8v.4"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                />
              </svg>
              <p data-l10n-id="settings-folder-onedrive"></p>
            </div>
            <div class="row stack" data-search="settings-file-name">
              <div class="row-text">
                <label
                  for="file-name"
                  data-l10n-id="settings-file-name"
                ></label>
                <p data-l10n-id="settings-file-name-detail"></p>
              </div>
              <div class="pattern">
                <input
                  type="text"
                  id="file-name"
                  name="fileName"
                  dir="auto"
                  spellcheck="false"
                  autocomplete="off"
                  aria-describedby="file-name-example"
                />
                <span class="extension" dir="ltr">.png</span>
              </div>
              <div class="tokens">
                <span data-l10n-id="settings-file-name-insert"></span>
                <button
                  type="button"
                  data-token="{date}"
                  data-l10n-id="settings-file-name-date"
                ></button>
                <button
                  type="button"
                  data-token="{time}"
                  data-l10n-id="settings-file-name-time"
                ></button>
                <button
                  type="button"
                  data-token="{width}"
                  data-l10n-id="settings-file-name-width"
                ></button>
                <button
                  type="button"
                  data-token="{height}"
                  data-l10n-id="settings-file-name-height"
                ></button>
              </div>
              <p class="example" id="file-name-example" aria-live="polite"></p>
            </div>
            <div class="row" data-search="settings-keep-out-of-history">
              <div class="row-text">
                <label
                  for="keep-out-of-history"
                  data-l10n-id="settings-keep-out-of-history"
                ></label>
                <p data-l10n-id="settings-keep-out-of-history-detail"></p>
              </div>
              <span class="switch">
                <input
                  type="checkbox"
                  role="switch"
                  id="keep-out-of-history"
                  name="keepOutOfHistory"
                />
                <span class="switch-text" aria-hidden="true">
                  <span class="on" data-l10n-id="settings-on"></span>
                  <span class="off" data-l10n-id="settings-off"></span>
                </span>
              </span>
            </div>
          </div>
        </section>
        <section class="group" id="memory">
          <h2 data-l10n-id="settings-section-memory"></h2>
          <div class="card">
            <div class="row" data-search="settings-release-gpu">
              <div class="row-text">
                <label
                  for="release-gpu"
                  data-l10n-id="settings-release-gpu"
                ></label>
                <p data-l10n-id="settings-release-gpu-detail"></p>
              </div>
              <span class="switch">
                <input
                  type="checkbox"
                  role="switch"
                  id="release-gpu"
                  name="releaseGpuWhileIdle"
                />
                <span class="switch-text" aria-hidden="true">
                  <span class="on" data-l10n-id="settings-on"></span>
                  <span class="off" data-l10n-id="settings-off"></span>
                </span>
              </span>
            </div>
          </div>
        </section>
        <section class="group" id="updates">
          <h2 data-l10n-id="settings-section-updates"></h2>
          <div class="card">
            <div class="row" data-search="settings-update-version">
              <div class="row-text">
                <span id="update-name"></span>
                <p id="update-said" aria-live="polite"></p>
              </div>
              <button type="button" class="button" id="update-action"></button>
            </div>
            <div class="row" data-search="settings-check-for-updates">
              <div class="row-text">
                <label
                  for="check-for-updates"
                  data-l10n-id="settings-check-for-updates"
                ></label>
                <p data-l10n-id="settings-check-for-updates-detail"></p>
              </div>
              <span class="switch">
                <input
                  type="checkbox"
                  role="switch"
                  id="check-for-updates"
                  name="checkForUpdates"
                />
                <span class="switch-text" aria-hidden="true">
                  <span class="on" data-l10n-id="settings-on"></span>
                  <span class="off" data-l10n-id="settings-off"></span>
                </span>
              </span>
            </div>
          </div>
        </section>
        <section class="group" id="about">
          <h2 data-l10n-id="settings-section-about"></h2>
          <div class="card">
            <div class="row about" data-search="settings-about">
              <svg viewBox="0 0 256 256" aria-hidden="true">
                <g transform="translate(-8.96 -8.96) scale(1.07)">
                  <path
                    d="M128 14L242 128 128 242 14 128z"
                    fill="#0c2328"
                    stroke="#33969b"
                    stroke-width="10"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M128 128L71 71M128 128L185 71M128 128L185 185M128 128L71 185"
                    fill="none"
                    stroke="#33969b"
                    stroke-width="10"
                  />
                  <path
                    d="M108 78l20-20 20 20M178 108l20 20-20 20M148 178l-20 20-20-20M78 148l-20-20 20-20"
                    fill="none"
                    stroke="#ffffff"
                    stroke-width="14"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path d="M128 95l33 33-33 33-33-33z" fill="#33969b" />
                </g>
              </svg>
              <div class="row-text">
                <span class="about-name" id="about-name"></span>
                <p data-l10n-id="settings-about-detail"></p>
              </div>
              <div class="actions">
                <button
                  type="button"
                  class="button"
                  id="show-licences"
                  data-l10n-id="settings-licences"
                ></button>
                <button
                  type="button"
                  class="button"
                  id="open-logs"
                  data-l10n-id="settings-open-logs"
                ></button>
                <button
                  type="button"
                  class="button"
                  id="open-source"
                  data-l10n-id="settings-source"
                ></button>
              </div>
              <p class="row-error" id="about-error" role="alert" hidden></p>
            </div>
          </div>
        </section>
        <p class="empty" hidden></p>
      </form>
      <p class="save-error" role="alert" hidden></p>
      <dialog class="licences" id="licences" aria-labelledby="licences-title">
        <h2 id="licences-title" data-l10n-id="settings-licences"></h2>
        <pre id="licences-text" dir="ltr" lang="en"></pre>
        <form method="dialog">
          <button
            class="button primary"
            data-l10n-id="settings-licences-close"
          ></button>
        </form>
      </dialog>
    </div>
  </body>
</html>
