[package]
name = "bediz-core"
description = "Platform-independent logic of Bediz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
gif = { version = "0.14.2", default-features = false, features = ["raii_no_panic", "std"] }
png = "0.18.1"
quantette = { version = "0.6.0", default-features = false }
rxing = { version = "0.9.4", default-features = false, features = ["qrcode", "decoders", "multi_barcode_readers", "encoding_rs"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
qrcodegen = "1.8.0"

[[bench]]
name = "animation"
harness = false

[lints]
workspace = true
