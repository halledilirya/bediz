name: Idea
description: Something Bediz could do
labels: [idea]
body:
  - type: textarea
    id: need
    attributes:
      label: What you want to do
      description: The task you have in mind, not only the feature.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: With Bediz or another tool, if at all.
