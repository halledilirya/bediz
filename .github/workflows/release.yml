name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  build:
    name: Build
    needs: dependencies
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version and release notes
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          $crate = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($crate -ne $version) { throw "The tag is $version but Cargo.toml says $crate" }
          $section = [System.Collections.Generic.List[string]]::new()
          $inside = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line.StartsWith("## [")) {
              if ($inside) { break }
              $inside = $line.StartsWith("## [$version]")
            } elseif ($inside) {
              $section.Add($line)
            }
          }
          $notes = ($section -join "`n").Trim()
          if (-not $notes) { throw "CHANGELOG.md has no section for $version" }
          New-Item -ItemType Directory -Force release-files | Out-Null
          Set-Content -Encoding utf8 release-files/notes.md $notes
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Licence notices of the Rust crates
        run: |
          cargo install cargo-about --locked --features cli --version 0.9.3
          New-Item -ItemType Directory -Force app/public/licences | Out-Null
          cargo about generate --output-file app/public/licences/rust.txt about.hbs
      - name: Build the installer
        working-directory: app
        run: |
          npm ci
          npm run tauri build
      - name: Collect the installer
        run: |
          $installers = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw "Expected one installer, found $($installers.Count)" }
          Copy-Item $installers[0].FullName release-files
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release-files/
          if-no-files-found: error

  sign:
    name: Sign the update
    needs: build
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the Tauri CLI
        working-directory: app
        run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      - name: Sign the installer for the updater
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          $installer = (Get-ChildItem ../release-files/*-setup.exe).FullName
          npm run tauri signer sign -- --app-version $version $installer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature
          path: release-files/*.sig
          if-no-files-found: error

  publish:
    name: Publish
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signature
          path: release-files
      - name: Checksums
        working-directory: release-files
        run: sha256sum *-setup.exe > SHA256SUMS.txt
      - name: Update manifest
        working-directory: release-files
        run: |
          installer=$(ls *-setup.exe)
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --rawfile notes notes.md \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "$installer.sig")" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$installer" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' \
            > latest.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-files/*-setup.exe
      - name: Draft the release
        working-directory: release-files
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag
          --title "Bediz $GITHUB_REF_NAME" --notes-file notes.md
          *-setup.exe SHA256SUMS.txt latest.json
