name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  release:
    name: Build and publish
    needs: dependencies
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version and release notes
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          $crate = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($crate -ne $version) { throw "The tag is $version but Cargo.toml says $crate" }
          $section = [System.Collections.Generic.List[string]]::new()
          $inside = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line.StartsWith("## [")) {
              if ($inside) { break }
              $inside = $line.StartsWith("## [$version]")
            } elseif ($inside) {
              $section.Add($line)
            }
          }
          $notes = ($section -join "`n").Trim()
          if (-not $notes) { throw "CHANGELOG.md has no section for $version" }
          Set-Content -Encoding utf8 release-notes.md $notes
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Licence notices of the Rust crates
        run: |
          cargo install cargo-about --locked --features cli --version 0.9.3
          New-Item -ItemType Directory -Force app/public/licences | Out-Null
          cargo about generate --output-file app/public/licences/rust.txt about.hbs
      - name: Build the installer
        working-directory: app
        run: |
          npm ci
          npm run tauri build
      - name: Checksums
        id: files
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Out-File -Encoding ascii SHA256SUMS.txt
          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.files.outputs.installer }}
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$env:GITHUB_REF_NAME" --draft --verify-tag
          --title "Bediz $env:GITHUB_REF_NAME" --notes-file release-notes.md
          "${{ steps.files.outputs.installer }}" SHA256SUMS.txt
