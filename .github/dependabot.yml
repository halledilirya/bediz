version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # These follow the windows-rs version Tauri's wry uses; bumping one alone splits windows-core in two.
      - dependency-name: windows
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: windows-core
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: webview2-com
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # typescript-eslint supports TypeScript only up to the version its peer range allows.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
